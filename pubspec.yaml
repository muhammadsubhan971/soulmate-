name: soul_mate
description: A professional matrimonial app with AI-powered matchmaking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.0.0
  intl: ^0.19.0
  
  # State Management
  provider: ^6.1.1
  get: ^4.6.6
  
  # Supabase
  supabase_flutter: ^2.3.4
  
  # Authentication & Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Image & Camera
  image_picker: ^1.0.7
  camera: ^0.10.5+9
  path_provider: ^2.1.2
  path: ^1.9.0
  image: ^4.1.7
  
  # UI Components
  flutter_swiper_null_safety: ^1.0.2
  card_swiper: ^3.0.1
  smooth_page_indicator: ^1.1.0
  flutter_rating_bar: ^4.0.1
  percent_indicator: ^4.2.3
  
  # Forms & Validation
  form_field_validator: ^1.1.0
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  
  # Chat
  flutter_chat_ui: ^1.6.10
  
  # Utils
  uuid: ^4.3.3
  http: ^1.2.0
  url_launcher: ^6.2.4
  permission_handler: ^11.3.0
  geolocator: ^11.0.0
  
  # Payments
  flutter_stripe: ^10.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  # fonts:
